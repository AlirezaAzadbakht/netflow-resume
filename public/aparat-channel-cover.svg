<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="423" viewBox="0 0 2560 423" fill="none" role="img" aria-label="NetflowAI Aparat channel cover">
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ede9fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbfaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotted-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7C3AED" fill-opacity="0.18"/>
    </pattern>
    <style type="text/css"><![CDATA[
      .node-label {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2px;
        text-anchor: middle;
      }
    ]]></style>
  </defs>

  <rect width="2560" height="423" fill="url(#page-bg)"/>
  <rect width="2560" height="423" fill="url(#center-glow)"/>
  <rect width="2560" height="423" fill="url(#dotted-grid)" opacity="0.30"/>

  <!-- Banner layout: all nodes fit in ~6:1 crop (2560×423) -->
  <!-- Positions: Input 180,120 | Log 280,300 | Agent 720,95 | RAG 720,300 | Model 1400,120 | Voice 1400,300 | Output 2200,210 -->
  <g>
    <g fill="none" stroke="url(#edge-grad)" stroke-width="2.5" stroke-linecap="round">
      <path d="M 250 120 C 420 120, 520 95, 686 95"/>
      <path d="M 250 120 C 420 120, 520 300, 686 300"/>
      <path d="M 350 300 C 480 300, 560 300, 686 300"/>
      <path d="M 754 95 C 1000 95, 1160 120, 1366 120"/>
      <path d="M 754 300 C 1000 300, 1160 120, 1366 120"/>
      <path d="M 754 300 C 1000 300, 1160 300, 1366 300"/>
      <path d="M 1434 120 C 1700 120, 1900 210, 2166 210"/>
      <path d="M 1434 300 C 1700 300, 1900 210, 2166 210"/>
    </g>

    <g fill="#7C3AED">
      <circle cx="400" cy="115" r="3.5" opacity="0.75"/>
      <circle cx="480" cy="190" r="3.5" opacity="0.55"/>
      <circle cx="500" cy="300" r="3.5" opacity="0.65"/>
      <circle cx="1050" cy="105" r="3.5" opacity="0.7"/>
      <circle cx="1100" cy="200" r="3.5" opacity="0.55"/>
      <circle cx="1100" cy="290" r="3.5" opacity="0.6"/>
      <circle cx="1750" cy="145" r="3.5" opacity="0.7"/>
      <circle cx="1750" cy="270" r="3.5" opacity="0.55"/>
    </g>

    <!-- Input -->
    <g>
      <circle cx="180" cy="120" r="48" fill="url(#node-glow)"/>
      <rect x="130" y="98" width="100" height="44" rx="12" fill="#ffffff" stroke="#A78BFA" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="180" y="126" fill="#A78BFA">Input</text>
    </g>
    <!-- Log -->
    <g>
      <circle cx="280" cy="300" r="48" fill="url(#node-glow)"/>
      <rect x="230" y="278" width="100" height="44" rx="12" fill="#ffffff" stroke="#C4B5FD" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="280" y="306" fill="#C4B5FD">Log</text>
    </g>
    <!-- Agent -->
    <g>
      <circle cx="720" cy="95" r="48" fill="url(#node-glow)"/>
      <rect x="670" y="73" width="100" height="44" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="720" y="101" fill="#7C3AED">Agent</text>
    </g>
    <!-- RAG -->
    <g>
      <circle cx="720" cy="300" r="48" fill="url(#node-glow)"/>
      <rect x="670" y="278" width="100" height="44" rx="12" fill="#ffffff" stroke="#8B5CF6" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="720" y="306" fill="#8B5CF6">RAG</text>
    </g>
    <!-- Model -->
    <g>
      <circle cx="1400" cy="120" r="48" fill="url(#node-glow)"/>
      <rect x="1350" y="98" width="100" height="44" rx="12" fill="#ffffff" stroke="#7C3AED" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="1400" y="126" fill="#7C3AED">Model</text>
    </g>
    <!-- Voice -->
    <g>
      <circle cx="1400" cy="300" r="48" fill="url(#node-glow)"/>
      <rect x="1350" y="278" width="100" height="44" rx="12" fill="#ffffff" stroke="#A78BFA" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="1400" y="306" fill="#A78BFA">Voice</text>
    </g>
    <!-- Output -->
    <g>
      <circle cx="2200" cy="210" r="48" fill="url(#node-glow)"/>
      <rect x="2145" y="188" width="110" height="44" rx="12" fill="#ffffff" stroke="#6D28D9" stroke-width="2" filter="url(#soft-shadow)"/>
      <text class="node-label" x="2200" y="216" fill="#6D28D9">Output</text>
    </g>
  </g>
</svg>